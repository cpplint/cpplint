[tox]
envlist = py39, py3.10, py311, py312, py313, pypy3
skip_missing_interpreters = true

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    pypy3.11: pypy3

[testenv]
extras = dev

commands =
  {envpython} -m pytest {posargs:}
  {envpython} -m pylint
  {envpython} -m flake8 .
