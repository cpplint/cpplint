[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61.2" ]

[project]
name = "cpplint"
description = "Check C++ files configurably against Google's style guide"
readme = "README.rst"
keywords = [ "c++", "cpp", "google style", "lint" ]
license = { text = "BSD-3-Clause" }
maintainers = [
  { name = "Aaron Liu", email = "aaronliu0130@gmail.com" },
  { name = "Christian Clauss", email = "cclauss@me.com" },
  { name = "John Vandenberg", email = "jayvdb@gmail.com" },
]
authors = [
  { name = "Google Inc." },
  { name = "Thibault Kruse" },
  { name = "Andrew Davis", email = "theandrewdavis@gmail.com" },
  { name = "cpplint developers" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: Freely Distributable",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dynamic = [ "version" ]
dependencies = [  ]

optional-dependencies.dev = [
  "parameterized",
  "pylint>=2.11",
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "testfixtures",
  "tox<5",
]
urls.Homepage = "https://github.com/cpplint/cpplint"
scripts.cpplint = "cpplint:main"

[tool.setuptools]
py-modules = [ "cpplint" ]
include-package-data = false
dynamic.version = { attr = "cpplint.__VERSION__" }

[tool.ruff]
target-version = "py38"

line-length = 116
lint.select = [
  "A",     # flake8-builtins
  "AIR",   # Airflow
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # McCabe cyclomatic complexity
  "DJ",    # flake8-django
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "FA",    # flake8-future-annotations
  "FAST",  # FastAPI
  "FBT",   # flake8-boolean-trap
  "FIX",   # flake8-fixme
  "FLY",   # flynt
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INP",   # flake8-no-pep420
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "NPY",   # NumPy-specific rules
  "PD",    # pandas-vet
  "PERF",  # Perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PLC",   # Pylint conventions
  "PLE",   # Pylint errors
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "SLOT",  # flake8-slots
  "T10",   # flake8-debugger
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "W",     # pycodestyle
  "YTT",   # flake8-2020
  # "ANN", # flake8-annotations
  # "ARG", # flake8-unused-arguments
  # "COM", # flake8-commas
  # "CPY", # flake8-copyright
  # "D",   # pydocstyle
  # "DOC", # pydoclint
  # "ERA", # eradicate
  # "N",   # pep8-naming
  # "PLR", # Pylint refactor
  # "PLW", # Pylint warnings
  # "PT",  # flake8-pytest-style
  # "PTH", # flake8-use-pathlib
  # "Q",   # flake8-quotes
  # "RUF", # Ruff-specific rules
  # "S",   # flake8-bandit
  # "SIM", # flake8-simplify
  # "SLF", # flake8-self
  # "T20", # flake8-print
  # "TD",  # flake8-todos
  # "UP",  # pyupgrade
]
lint.ignore = [
  "FBT003", # flake8-boolean-trap
  "FIX002", # flake8-fixme
  "ISC003", # flake8-implicit-str-concat
  "PIE790", # Unnecessary `pass` statement
]
lint.per-file-ignores."cpplint.py" = [ "ICN001", "PERF401" ]
lint.per-file-ignores."cpplint_unittest.py" = [ "FLY002" ]
lint.mccabe.max-complexity = 29

[tool.pylint.basic]
include-naming-hint = true
method-rgx = "[A-Z_][A-Za-z0-9]{2,49}$|__init__|__str__|__contains__"
function-rgx = "[A-Z_][A-Za-z0-9]{2,49}$|main"
const-rgx = "[a-zA-Z_][A-Za-z0-9_]{2,49}$"
variable-rgx = "[a-z_][a-z0-9_]{0,49}$"
argument-rgx = "[a-z_][a-z0-9_]{0,49}$"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"

[tool.pylint.messages-control]
disable = [
  "global-statement",
  "multiple-statements",
  "missing-docstring",
  "no-else-return",
  "no-self-use",
  "consider-merging-isinstance",
  "consider-using-min-builtin",
  "bad-continuation",
  "fixme",
  "bad-option-value",
  "anomalous-unicode-escape-in-string",
  "unused-argument",
  "useless-object-inheritance",
  "consider-using-dict-comprehension",
  "consider-using-in",
  "unnecessary-pass",
  "too-many-positional-arguments",
]

[tool.pylint.reports]
output-format = "colorized"
reports = false
score = false

[tool.pylint.format]
indent-string = '  '
indent-after-paren = 4
max-module-lines = 10000

[tool.pylint.design]
max-locals = 25
max-line-length = 100
max-attributes = 10
max-branches = 30
max-args = 20
max-statements = 75
max-returns = 10
min-public-methods = 0
max-bool-expr = 10

[tool.pytest.ini_options]
python_files = [ "*test.py" ]
testpaths = [ "." ]
required_plugins = [ "pytest-cov", "pytest-timeout" ]
timeout = 60
# fail if coverage is under 90%
addopts = "--color=yes --cov-fail-under=90 --cov=cpplint"
